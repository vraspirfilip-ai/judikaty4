<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judikatura NS a ÚS – týdenní přehled</title>
<link rel="alternate" type="application/rss+xml" title="Judikatura NS a ÚS" href="feed.xml">
<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#1d1d1b; --muted:#6b6860; --line:#e4e0d6;
          --accent:#7a1f2b; --us:#1f4e79; --ns:#7a1f2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --card:#202026; --ink:#ece9e2; --muted:#a19d94; --line:#33333b;
            --accent:#e07a86; --us:#7fb0e0; --ns:#e07a86; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  header { padding:2.2rem 1.2rem 1rem; max-width:980px; margin:0 auto; }
  h1 { font-size:1.9rem; margin:0 0 .25rem; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-family:system-ui, sans-serif; font-size:.92rem; }
  .filtry { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
            padding:.7rem 1.2rem; font-family:system-ui, sans-serif; font-size:.9rem; }
  .filtry .in { max-width:980px; margin:0 auto; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  input[type=search], select { font:inherit; padding:.45rem .6rem; border:1px solid var(--line);
            border-radius:6px; background:var(--card); color:var(--ink); }
  input[type=search] { flex:1 1 240px; }
  label { display:flex; gap:.35rem; align-items:center; color:var(--muted); }
  main { max-width:980px; margin:0 auto; padding:1rem 1.2rem 4rem; }
  .den { font-family:system-ui, sans-serif; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em;
         color:var(--muted); margin:2rem 0 .6rem; }
  article { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--ns);
            border-radius:8px; padding:1rem 1.2rem; margin:.7rem 0; }
  article.US { border-left-color:var(--us); }
  .hlava { display:flex; flex-wrap:wrap; gap:.4rem .8rem; align-items:baseline; }
  .spzn { font-weight:700; font-size:1.12rem; }
  .spzn a { color:inherit; text-decoration:none; } .spzn a:hover { text-decoration:underline; }
  .meta { font-family:system-ui, sans-serif; font-size:.82rem; color:var(--muted); }
  .stitek { font-family:system-ui, sans-serif; font-size:.72rem; padding:.1rem .45rem; border-radius:99px;
            border:1px solid var(--line); color:var(--muted); }
  .v-vysoký { background:var(--accent); color:#fff; border-color:var(--accent); }
  .otazky { margin:.6rem 0 .4rem; padding-left:1.3rem; }
  .otazky li { margin:.25rem 0; }
  .otazky .o { font-style:italic; }
  .otazky .a { color:var(--muted); }
  .nad { font-family:system-ui, sans-serif; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em;
         color:var(--muted); margin-top:.6rem; }
  .vety { margin:.6rem 0 0; padding:.6rem .9rem; border-left:3px solid var(--line); }
  .vety p { margin:.3rem 0; font-weight:600; }
  .pata { font-family:system-ui, sans-serif; font-size:.8rem; color:var(--muted); margin-top:.6rem; }
  .prazdne { color:var(--muted); text-align:center; padding:3rem 0; font-family:system-ui, sans-serif; }
  .vic { display:block; margin:1.5rem auto; font:inherit; font-family:system-ui, sans-serif; padding:.5rem 1rem;
         border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Judikatura Nejvyššího a Ústavního soudu</h1>
  <div class="sub">Nová rozhodnutí každý pátek · shrnutí a právní věty vytváří AI z plného textu – vždy ověřte v originálu · <a href="feed.xml">RSS</a></div>
</header>
<div class="filtry"><div class="in">
  <input type="search" id="q" placeholder="Hledat (sp. zn., paragraf, heslo, text)…">
  <select id="soud"><option value="">Oba soudy</option><option value="US">Ústavní soud</option><option value="NS">Nejvyšší soud</option></select>
  <select id="vyznam"><option value="">Jakýkoli význam</option><option value="vysoký">Vysoký</option><option value="střední">Střední a vyšší</option></select>
  <select id="oblast"><option value="">Všechny oblasti</option></select>
  <label><input type="checkbox" id="procesni"> i procesní</label>
</div></div>
<main id="seznam"><div class="prazdne">Načítám…</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cz = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-"); return `${+d}. ${+m}. ${y}`; };
const NAZEV = {US:"Ústavní soud", NS:"Nejvyšší soud"};
let data = [], zobrazit = 60;

function filtr() {
  const q = $("#q").value.trim().toLowerCase(), soud = $("#soud").value, vyz = $("#vyznam").value,
        obl = $("#oblast").value, proc = $("#procesni").checked;
  return data.filter(z =>
    (!soud || z.soud === soud) &&
    (!obl || z.oblast === obl) &&
    (proc || !z.procesni) &&
    (!vyz || (vyz === "vysoký" ? z.vyznam === "vysoký" : z.vyznam !== "nízký")) &&
    (!q || [z.spzn, z.ecli, ...(z.otazky||[]).map(o => o.otazka + " " + o.odpoved), z.shrnuti, z.vysledek, ...(z.vety||[]), ...(z.predpisy||[]), ...(z.hesla||[])]
            .join(" ").toLowerCase().includes(q)));
}

function karta(z) {
  const vety = (z.vety || []).map(v => `<p>${esc(v)}</p>`).join("");
  return `<article class="${z.soud}">
    <div class="hlava">
      <span class="spzn"><a href="${esc(z.url)}" target="_blank" rel="noopener">${esc(z.spzn || z.id)}</a></span>
      <span class="meta">${NAZEV[z.soud]} · ${esc(z.forma || "rozhodnutí")}${z.datum ? " ze dne " + cz(z.datum) : ""}${z.kategorie ? " · kat. " + esc(z.kategorie) : ""}</span>
      ${z.vyznam ? `<span class="stitek v-${esc(z.vyznam)}">${esc(z.vyznam)} význam</span>` : ""}
      ${z.oblast ? `<span class="stitek">${esc(z.oblast)}</span>` : ""}
    </div>
    <div style="margin-top:.5rem">${esc(z.shrnuti)}</div>
    ${(z.otazky||[]).length ? `<div class="nad">Klíčové řešené otázky</div><ol class="otazky">${z.otazky.map(o =>
        `<li><span class="o">${esc(o.otazka)}</span>${o.odpoved ? `<br><span class="a">→ ${esc(o.odpoved)}</span>` : ""}</li>`).join("")}</ol>` : ""}
    ${vety ? `<div class="nad">Právní věty</div>` : ""}
    ${vety ? `<div class="vety">${vety}</div>` : ""}
    <div class="pata">${z.vysledek ? "Výsledek: " + esc(z.vysledek) : ""}${(z.predpisy||[]).length ? " · " + esc(z.predpisy.join(", ")) : ""}</div>
  </article>`;
}

function vykresli() {
  const f = filtr(), el = $("#seznam");
  if (!f.length) { el.innerHTML = `<div class="prazdne">Nic nenalezeno.</div>`; return; }
  let html = "", den = "";
  for (const z of f.slice(0, zobrazit)) {
    if (z.zpracovano !== den) { den = z.zpracovano; html += `<div class="den">Zpracováno ${cz(den)}</div>`; }
    html += karta(z);
  }
  if (f.length > zobrazit) html += `<button class="vic" id="vic">Zobrazit další (${f.length - zobrazit})</button>`;
  el.innerHTML = html;
  const b = $("#vic"); if (b) b.onclick = () => { zobrazit += 60; vykresli(); };
}

fetch("data.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
  data = d;
  const oblasti = [...new Set(d.map(z => z.oblast).filter(Boolean))].sort((a,b) => a.localeCompare(b, "cs"));
  $("#oblast").innerHTML += oblasti.map(o => `<option>${esc(o)}</option>`).join("");
  ["#q","#soud","#vyznam","#oblast","#procesni"].forEach(s => $(s).addEventListener("input", () => { zobrazit = 60; vykresli(); }));
  vykresli();
}).catch(() => { $("#seznam").innerHTML = `<div class="prazdne">Zatím žádná data – počkejte na první běh.</div>`; });
</script>
</body>
</html>
