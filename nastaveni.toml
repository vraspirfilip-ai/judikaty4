# Nastavení judikáty bota. Po úpravě stačí soubor uložit (commit) na GitHubu.
# Bot běží jednou týdně – v pátek v 17:00 (pražského času), viz .github/workflows/tydne.yml.

[obecne]
# Batch API = poloviční cena. Výsledky ale nejsou hned: obvykle do hodiny, nejpozději do 24 h.
# false = zpracovat okamžitě za plnou cenu.
davkove_zpracovani = true
# Jak dlouho hlavní běh čeká na dokončení dávky (minuty, max. cca 300 kvůli limitu GitHubu).
# Co nedoběhne, vyzvedne některý z kontrolních běhů (pátek ~20:30 a ~23:30, sobota ~8:30).
max_cekani_na_davku_min = 240
# PRVNÍ SPUŠTĚNÍ: zpracují se rozhodnutí od tohoto data (formát "RRRR-MM-DD").
# Prázdné "" = jen pár nejnovějších (viz prvni_beh_max). Po prvním běhu se už nepoužije.
prvni_beh_od = "2026-11-23"
# Podle jakého data: "zverejneni" (kdy soud rozhodnutí zveřejnil – doporučeno, NS zveřejňuje
# rozhodnutí se zpožděním až 2 měsíce) nebo "rozhodnuti" (kdy bylo rozhodnutí vydáno).
prvni_beh_podle = "zverejneni"
# Model Claude. Levnější varianta: "claude-haiku-5-5", nejkvalitnější: "claude-opus-5-5".
model = "claude-sonnet-5-5"
# Delší rozhodnutí se zkrátí (začátek + konec), aby nebyl rozbor zbytečně drahý.
max_znaku_textu = 120000
# Prodleva mezi dotazy na weby soudů (sekundy) – buďme k serverům soudů ohleduplní.
prodleva_mezi_dotazy_s = 1.5
# V přehledu dát čistě procesní rozhodnutí (odmítnutí bez právního závěru) jen do krátkého seznamu.
skryt_procesni_v_prehledu = true
# Adresa vašeho webu na GitHub Pages (pro RSS), např. "https://uzivatel.github.io/judikaty-bot/"
adresa_webu = "https://vraspirfilip-ai.github.io/judikaty4/"

[nejvyssi_soud]
zapnuto = true

# Senáty, které vás zajímají (číslo na začátku spisové značky, např. 21 Cdo 2128/2025 → 21).
# Rozhodnutí ostatních senátů se vůbec nestahují. Prázdný seznam [] = všechny senáty.
# Které senáty rozhodují jakou agendu, uvádí rozvrh práce NS (nsoud.cz → Rozvrh práce).
# Příklad:  senaty = [21, 22, 25, 33]
senaty = [21, 22, 23, 24, 26, 27, 28, 29]

# Rozhodnutí z těchto oblastí se vyřadí (bez ohledu na senát) ještě před AI rozborem, takže nic nestojí.
# Pozná se podle metadat NS (heslo, dotčené předpisy) a záhlaví rozhodnutí (předmět řízení).
# Seznam vyřazených je na konci každého týdenního přehledu, abyste mohl filtr zkontrolovat.
# Možnosti:
#   "pracovni"            pracovní právo (výpovědi, mzdy, pracovní úrazy, zákoník práce)
#   "dedicke"             dědické právo (pozůstalost, závěť, povinný díl)
#   "restituce"           restituce a rehabilitace (zák. 229/1991, 87/1991, 428/2012 …)
#   "rodinne"             rodinné právo (rozvod, výživné, péče o děti, otcovství, osvojení)
#   "sjm"                 společné jmění manželů
#   "soudni_uschovy"      soudní úschovy
#   "nekala_soutez"       nekalá soutěž (§ 2976 a násl. o. z., klamavá reklama, záměna)
#   "arbitraze"           rozhodčí řízení (rozhodčí nálezy a doložky, zák. 216/1994)
#   "dusevni_vlastnictvi" duševní vlastnictví (autorské právo, ochranné známky, patenty, vzory)
# Lze psát i volněji („rodinné věci“, „dědictví“). Prázdný seznam [] = nic nevyřazovat.
vyloucit.oblasti = ["pracovni", "dedicke", "restituce", "rodinne", "soudni_uschovy", "nekala_soutez", "arbitraze", "dusevni_vlastnictvi"]
# Vlastní vyřazovací výrazy (regulární výrazy, hledají se v záhlaví a metadatech), např. ["insolvenční"]
vyloucit.vlastni_vzory = []

# Kategorie NS: A = nejvýznamnější … E = ostatní. Zpracují se jen uvedené.
kategorie = ["A", "B"]

# Strop rozhodnutí zpracovaných AI za jeden (týdenní) běh. Zbytek se zpracuje příští týden.
max_rozhodnuti_za_beh = 100
# Při prvním spuštění bez prvni_beh_od se zpracuje jen pár nejnovějších.
prvni_beh_max = 10
# Rozhodnutí zveřejněná dříve než před tolika dny se přeskočí.
max_stari_dni = 30
# Kolik stránek výsledků vyhledávání projít a kolik výsledků na stránku
# (týdně NS zveřejní stovky rozhodnutí, proto víc stránek).
max_stranek = 12
na_stranku = 50
# Vlastní doplňující fulltextový dotaz (syntaxe Lotus Domino). Prázdné = bez omezení.
# Příklad jen civilní dovolání: '[spzn2]=Cdo'
dotaz = ""
# Ukládat do repozitáře i plný text rozhodnutí (repo pak rychle roste).
ulozit_plny_text = false

[ustavni_soud]
zapnuto = true
# Jen nálezy (usnesení, i když o nich ÚS vydal tiskovou zprávu, se přeskočí).
jen_nalezy = true
max_rozhodnuti_za_beh = 40
prvni_beh_max = 10
# Kolik dní zpětně procházet RSS Ústavního soudu (musí být víc než 7 kvůli týdennímu běhu).
max_stari_dni = 10
ulozit_plny_text = false
